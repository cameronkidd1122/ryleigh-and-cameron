<section id="login-panel" class="rsvp-card login-panel"><h1>Ryleigh &amp; Cameron</h1><form id="login-form"><div class="form-field"><label class="form-label" for="email">Email</label><input class="form-input" id="email" type="email" autocomplete="username" required></div><div class="form-field"><label class="form-label" for="password">Password</label><input class="form-input" id="password" type="password" autocomplete="current-password" required></div><p class="form-error" id="login-error" role="alert" hidden></p><button class="submit-rsvp" id="sign-in" type="submit">Sign in</button></form></section>

<section class="admin-table" aria-labelledby="submitted-title"><h2 id="submitted-title">RSVPs Submitted</h2><p id="no-matches" class="admin-empty" hidden>No matching guests</p><table id="guest-table" hidden><thead><tr><th scope="col">Guest name</th><th scope="col">RSVP</th><th scope="col">Last updated</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody id="response-rows"></tbody></table></section></section></main><script src="./config.js"></script><script>
const statusLabels = { coming: 'Coming', declined: 'Not coming', undecided: 'Not yet decided' };
function cleanName(value) { return value.normalize('NFKC').replace(/\s+/gu, ' ').trim(); }
function duplicateNames(rows) { const counts = new Map(); for (const row of rows) counts.set(row.normalized_name, (counts.get(row.normalized_name) || 0) + 1); return new Set([...counts].filter(([, count]) => count > 1).map(([name]) => name)); }
const $ = id => document.getElementById(id);
function configured() { return /^https:\/\/[^/]+\.supabase\.co$/.test(WEDDING_CONFIG.url) && WEDDING_CONFIG.key.startsWith('sb_publishable_') && !WEDDING_CONFIG.key.includes('REPLACE'); }
async function api(path, { method = 'GET', body, token, headers = {} } = {}) {
  if (!configured()) throw new Error('RSVP service is not connected yet. Please try again later.');
  const response = await fetch(WEDDING_CONFIG.url + path, {
    method, headers: { apikey: WEDDING_CONFIG.key, ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(body !== undefined ? { 'Content-Type': 'application/json' } : {}), ...headers },
    ...(body !== undefined ? { body: JSON.stringify(body) } : {}), cache: 'no-store', signal: AbortSignal.timeout(20000)
  });
  const raw = await response.text(); let data; try { data = raw ? JSON.parse(raw) : null; } catch { throw new Error('The service returned an unexpected response. Please try again.'); }
  if (!response.ok) { const error = new Error(response.status === 429 ? 'Too many requests. Please wait and try again.' : response.status === 401 ? 'Please sign in again.' : 'The request could not be completed. Please try again.'); error.status = response.status; error.code = data?.code; if (data?.message === 'RSVP is closed!') error.message = 'RSVP is closed!'; throw error; }
  return data;
}
function showMessage(id, text) { $(id).textContent = text; $(id).hidden = !text; }


// A small, standards-based XLSX writer for this site's text-only RSVP workbook.
// Cells use inline strings, so guest-entered text can never become a formula.
const encoder = new TextEncoder();
const escapeXml = (value        ) => value.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&apos;");
const declaration = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
const mainNs = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const relNs = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const packageRelNs = 'http://schemas.openxmlformats.org/package/2006/relationships';
function crc32(data            ) {
  let crc = 0xffffffff;
  for (const byte of data) { crc ^= byte; for (let i = 0; i < 8; i++) crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1)); }
  return (crc ^ 0xffffffff) >>> 0;
}
function join(chunks              ) {
  const result = new Uint8Array(chunks.reduce((sum, chunk) => sum + chunk.length, 0));
  let offset = 0; for (const chunk of chunks) { result.set(chunk, offset); offset += chunk.length; } return result;
}
function zip(files                                  ) {
  const localParts               = []; const centralParts               = []; let offset = 0;
  for (const file of files) {
    const name = encoder.encode(file.name), data = encoder.encode(file.data), crc = crc32(data);
    const local = new Uint8Array(30), lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x800, true);
    lv.setUint16(12, 33, true); lv.setUint32(14, crc, true); lv.setUint32(18, data.length, true); lv.setUint32(22, data.length, true); lv.setUint16(26, name.length, true);
    const central = new Uint8Array(46), cv = new DataView(central.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x800, true);
    cv.setUint16(14, 33, true); cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true); cv.setUint16(28, name.length, true); cv.setUint32(42, offset, true);
    localParts.push(local, name, data); centralParts.push(central, name); offset += local.length + name.length + data.length;
  }
  const central = join(centralParts), end = new Uint8Array(22), view = new DataView(end.buffer);
  view.setUint32(0, 0x06054b50, true); view.setUint16(8, files.length, true); view.setUint16(10, files.length, true); view.setUint32(12, central.length, true); view.setUint32(16, offset, true);
  return join([...localParts, central, end]);
}
function worksheet(rows           , duplicates             ) {
  const headers = ["Guest name", "RSVP status", "Submitted (UTC)", "Updated (UTC)", "Name review"];
  const values = [headers, ...rows.map(row => [row.full_name, statusLabels[row.status], row.created_at, row.updated_at, duplicates.has(row.normalized_name) ? "Repeated name — review entries" : ""])];
  const cells = values.map((row, i) => `<row r="${i + 1}" ht="${i ? 24 : 28}" customHeight="1">${row.map((value, col) => `<c r="${String.fromCharCode(65 + col)}${i + 1}" t="inlineStr" s="${i ? 0 : 1}"><is><t xml:space="preserve">${escapeXml(value)}</t></is></c>`).join("")}</row>`).join("");
  return `${declaration}<worksheet xmlns="${mainNs}"><dimension ref="A1:E${values.length}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="24"/><cols><col min="1" max="1" width="32" customWidth="1"/><col min="2" max="2" width="23" customWidth="1"/><col min="3" max="4" width="29" customWidth="1"/><col min="5" max="5" width="38" customWidth="1"/></cols><sheetData>${cells}</sheetData><autoFilter ref="A1:E${values.length}"/></worksheet>`;
}
function makeRsvpWorkbook(rows           ) {
  const groups = [{ name: "All guests", rows }, { name: "Coming", rows: rows.filter(row => row.status === "coming") }, { name: "Not coming", rows: rows.filter(row => row.status === "declined") }, { name: "Not yet decided", rows: rows.filter(row => row.status === "undecided") }];
  const duplicates = duplicateNames(rows);
  const files = [
    { name: "[Content_Types].xml", data: `${declaration}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${groups.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>` },
    { name: "_rels/.rels", data: `${declaration}<Relationships xmlns="${packageRelNs}"><Relationship Id="rId1" Type="${relNs}/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: "xl/workbook.xml", data: `${declaration}<workbook xmlns="${mainNs}" xmlns:r="${relNs}"><bookViews><workbookView/></bookViews><sheets>${groups.map((group, i) => `<sheet name="${escapeXml(group.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>` },
    { name: "xl/_rels/workbook.xml.rels", data: `${declaration}<Relationships xmlns="${packageRelNs}">${groups.map((_, i) => `<Relationship Id="rId${i + 1}" Type="${relNs}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rId5" Type="${relNs}/styles" Target="styles.xml"/></Relationships>` },
    { name: "xl/styles.xml", data: `${declaration}<styleSheet xmlns="${mainNs}"><fonts count="2"><font><sz val="11"/><color rgb="FF203D31"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF244D3D"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"><alignment vertical="center"/></xf><xf numFmtId="49" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"><alignment vertical="center"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
    ...groups.map((group, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: worksheet(group.rows, duplicates) })),
  ];
  return zip(files);
}

let session = null, rows = [], actionBusy = false, rsvpsOpen = null;
function renderRsvpSetting() {
  $('rsvp-setting-status').textContent = rsvpsOpen === null ? 'RSVP availability could not be loaded. Use Refresh to retry.' : rsvpsOpen ? 'RSVPs are open' : 'RSVPs are closed';
  $('toggle-rsvps').textContent = rsvpsOpen === false ? 'Open RSVPs' : 'Close RSVPs';
  $('toggle-rsvps').disabled = actionBusy || rsvpsOpen === null;
}
async function loadRsvpSetting() {
  rsvpsOpen = null; renderRsvpSetting();
  const value = await api('/rest/v1/rpc/wedding_rsvps_open', {method:'POST', body:{}, token:token()});
  if (typeof value !== 'boolean') throw new Error('RSVP availability could not be loaded.');
  rsvpsOpen = value; renderRsvpSetting();
}
$('toggle-rsvps').addEventListener('click', async () => {
  if (actionBusy || rsvpsOpen === null) return;
  const next = !rsvpsOpen;
  controls(true); showMessage('admin-error', '');
  try {
    const value = await api('/rest/v1/rpc/wedding_set_rsvps_open', {method:'POST', body:{p_open:next}, token:token()});
    if (value !== next) throw new Error('The RSVP setting could not be confirmed. Use Refresh to check.');
    rsvpsOpen = value;
  } catch (error) { rsvpsOpen = null; showMessage('admin-error', error.message); }
  finally { controls(false); }
});
function lock() { rsvpsOpen = null; renderRsvpSetting(); session = null; rows = []; $('dashboard').hidden = true; $('login-panel').hidden = false; $('response-rows').replaceChildren(); $('search').value = ''; showMessage('admin-error', ''); }
function token() { if (!session || Date.now() >= session.expires) { lock(); showMessage('login-error', 'Please sign in again.'); throw new Error('Please sign in again.'); } return session.access; }
async function allRows() {
  const access = token();
  if (await api('/rest/v1/rpc/wedding_is_admin', {method:'POST', body:{}, token:access}) !== true) { lock(); throw new Error('This account does not have access.'); }
  const result = []; let cursor = '';
  for (;;) {
    const page = await api('/rest/v1/wedding_rsvps?select=id,full_name,normalized_name,status,created_at,updated_at&order=id.asc&limit=500' + (cursor ? '&id=gt.' + encodeURIComponent(cursor) : ''), {token:access});
    if (!Array.isArray(page)) throw new Error('Responses could not be loaded.');
    result.push(...page); if (!page.length) break; cursor = page[page.length - 1].id;
  }
  return result.sort((a,b) => b.updated_at.localeCompare(a.updated_at));
}
function render() {
  $('total-count').textContent = rows.length;
  for (const status of Object.keys(statusLabels)) $(status + '-count').textContent = rows.filter(row => row.status === status).length;
  const query = $('search').value.trim().toLocaleLowerCase();
  const visible = rows.filter(row => row.full_name.toLocaleLowerCase().includes(query));
  const duplicates = duplicateNames(rows); $('response-rows').replaceChildren();
  $('no-matches').hidden = !rows.length || !!visible.length;
  $('guest-table').hidden = !visible.length; $('search-wrap').hidden = !rows.length;
  for (const row of visible) {
    const tr = document.createElement('tr'); const name = document.createElement('td'); name.textContent = row.full_name;
    if (duplicates.has(row.normalized_name)) { const badge = document.createElement('small'); badge.textContent = 'Repeated name'; name.append(document.createElement('br'), badge); }
    const status = document.createElement('td'); const tag = document.createElement('span'); tag.className = 'status-tag status-' + row.status; tag.textContent = statusLabels[row.status]; status.append(tag);
    const updated = document.createElement('td'); const time = document.createElement('time'); time.dateTime = row.updated_at; time.textContent = new Date(row.updated_at).toLocaleString(); updated.append(time);
    const actions = document.createElement('td'); const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'small-button'; remove.textContent = 'Remove'; remove.setAttribute('aria-label', 'Remove RSVP for ' + row.full_name); remove.disabled = actionBusy;
    remove.addEventListener('click', () => removeRow(row)); actions.append(remove); tr.append(name, status, updated, actions); $('response-rows').append(tr);
  }
}
function controls(busy) { actionBusy = busy; $('refresh').disabled = busy; $('export').disabled = busy; renderRsvpSetting(); render(); }
async function refresh() {
  controls(true); showMessage('admin-error', '');
  try { rows = await allRows(); await loadRsvpSetting(); render(); } catch(error) { showMessage('admin-error', error.message); if (!session) showMessage('login-error', error.message); }
  finally { controls(false); }
}
$('login-form').addEventListener('submit', async event => {
  event.preventDefault(); if ($('sign-in').disabled) return; $('sign-in').disabled = true; showMessage('login-error', '');
  try {
    const auth = await api('/auth/v1/token?grant_type=password', {method:'POST', body:{email:$('email').value.trim(), password:$('password').value}});
    session = {access:auth.access_token, expires:Date.now() + auth.expires_in * 1000 - 30000};
    rows = await allRows(); $('password').value = ''; $('login-panel').hidden = true; $('dashboard').hidden = false; render(); $('dashboard-title').focus(); try { await loadRsvpSetting(); } catch (error) { showMessage('admin-error', error.message); }
  } catch(error) { lock(); showMessage('login-error', error.status === 400 ? 'Check your email and password.' : error.message); }
  finally { $('sign-in').disabled = false; }
});
$('sign-out').addEventListener('click', async () => { const access = session?.access; lock(); if (access) try { await api('/auth/v1/logout', {method:'POST', token:access}); } catch {} });
$('refresh').addEventListener('click', refresh);
$('search').addEventListener('input', render);
async function removeRow(row) {
  if (actionBusy || !confirm('Remove RSVP for ' + row.full_name + '?')) return;
  controls(true); showMessage('admin-error', '');
  try { await api('/rest/v1/wedding_rsvps?id=eq.' + encodeURIComponent(row.id), {method:'DELETE', token:token(), headers:{Prefer:'return=minimal'}}); rows = await allRows(); render(); }
  catch(error) { showMessage('admin-error', error.message); } finally { controls(false); }
}
$('export').addEventListener('click', async () => {
  if (actionBusy) return; controls(true); showMessage('admin-error', '');
  try {
    rows = await allRows(); render(); const data = makeRsvpWorkbook(rows);
    const url = URL.createObjectURL(new Blob([data], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const a = document.createElement('a'); a.href = url; a.download = 'Ryleigh-and-Cameron-RSVPs-' + new Date().toISOString().slice(0,10) + '.xlsx'; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch(error) { showMessage('admin-error', error.message); } finally { controls(false); }
});
setInterval(() => { if (session && Date.now() >= session.expires) { lock(); showMessage('login-error', 'Please sign in again.'); } }, 15000);
addEventListener('pagehide', lock);

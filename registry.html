const statusLabels = { coming: 'Coming', declined: 'Not coming', undecided: 'Not yet decided' };
function cleanName(value) { return value.normalize('NFKC').replace(/\s+/gu, ' ').trim(); }
function duplicateNames(rows) { const counts = new Map(); for (const row of rows) counts.set(row.normalized_name, (counts.get(row.normalized_name) || 0) + 1); return new Set([...counts].filter(([, count]) => count > 1).map(([name]) => name)); }
const $ = id => document.getElementById(id);
function configured() { return /^https:\/\/[^/]+\.supabase\.co$/.test(WEDDING_CONFIG.url) && WEDDING_CONFIG.key.startsWith('sb_publishable_') && !WEDDING_CONFIG.key.includes('REPLACE'); }
async function api(path, { method = 'GET', body, token, headers = {} } = {}) {
  if (!configured()) throw new Error('RSVP service is not connected yet. Please try again later.');
  const response = await fetch(WEDDING_CONFIG.url + path, {
    method, headers: { apikey: WEDDING_CONFIG.key, ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(body !== undefined ? { 'Content-Type': 'application/json' } : {}), ...headers },
    ...(body !== undefined ? { body: JSON.stringify(body) } : {}), cache: 'no-store', signal: AbortSignal.timeout(20000)
  });
  const raw = await response.text(); let data; try { data = raw ? JSON.parse(raw) : null; } catch { throw new Error('The service returned an unexpected response. Please try again.'); }
  if (!response.ok) { const error = new Error(response.status === 429 ? 'Too many requests. Please wait and try again.' : response.status === 401 ? 'Please sign in again.' : 'The request could not be completed. Please try again.'); error.status = response.status; error.code = data?.code; if (data?.message === 'RSVP is closed!') error.message = 'RSVP is closed!'; throw error; }
  return data;
}
function showMessage(id, text) { $(id).textContent = text; $(id).hidden = !text; }

function registryUrl(value) {
  const text = value.trim();
  if (text.length > 2048 || /\s/.test(text)) throw new Error('Enter a full https:// link without spaces.');
  let url;
  try { url = new URL(text); } catch { throw new Error('Enter a full https:// link for this item.'); }
  if (url.protocol !== 'https:' || !url.hostname || url.username || url.password) throw new Error('Use an https:// link without a username or password.');
  return url.href;
}
function registryCard(item) {
  const card = document.createElement('article'); card.className = 'registry-card';
  const title = document.createElement('h2'); title.textContent = item.title;
  const description = document.createElement('p'); description.className = 'registry-description'; description.textContent = item.description;
  const link = document.createElement('a'); link.className = 'venue-link'; link.textContent = 'View item ↗';
  link.href = registryUrl(item.url); link.target = '_blank'; link.rel = 'noopener noreferrer';
  link.setAttribute('aria-label', 'View ' + item.title + ' (opens in a new tab)');
  card.append(title, description, link); return card;
}

let registryLoading = false;
let registrySnapshot = '';
async function loadPublicRegistry() {
  if (registryLoading) return;
  registryLoading = true; $('registry-retry').hidden = true;
  try {
    const items = await api('/rest/v1/rpc/wedding_registry_items', {method:'POST',body:{}});
    if (!Array.isArray(items)) throw new Error('Our registry could not be loaded.');
    const snapshot = JSON.stringify(items);
    if (snapshot !== registrySnapshot) {
      const cards = items.map(registryCard);
      $('registry-items').replaceChildren(...cards); registrySnapshot = snapshot;
    }
    showMessage('registry-status', items.length ? '' : 'We’re putting together our wish list. Please check back soon!');
  } catch {
    showMessage('registry-status', 'Our registry could not be loaded right now. Please try again.');
    $('registry-retry').hidden = false;
  } finally { registryLoading = false; }
}
$('registry-retry').addEventListener('click', loadPublicRegistry);
addEventListener('focus', loadPublicRegistry);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadPublicRegistry(); });
setInterval(() => { if (!document.hidden) loadPublicRegistry(); }, 30000);
loadPublicRegistry();
